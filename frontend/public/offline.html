<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a2540" />
    <title>Sem conexão · CarciControl</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7fafc;
        color: #181c1e;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 32px;
        border: 1px solid #cbd5df;
        border-radius: 12px;
        background: white;
      }
      strong {
        color: #0a2540;
      }
      h1 {
        color: #0a2540;
        font-size: 28px;
        line-height: 1.25;
        margin: 28px 0 14px;
      }
      p {
        color: #43474d;
      }
      button {
        min-height: 52px;
        border: 0;
        border-radius: 8px;
        padding: 14px 20px;
        background: #0a2540;
        color: #fff;
        font: 700 16px system-ui;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #00696d;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>CarciControl</strong>
      <h1>Você está sem conexão.</h1>
      <p>
        Conecte-se à internet ou à rede do sistema para consultar e registrar os dados do cultivo.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
